<article
  class="account-card glass-panel glass-interactive glass-appear"
  [style.--card-color]="'var(' + colorVar() + ')'"
  appGlassShine
>
  <div class="account-card-top">
    <span class="account-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 20h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </span>
    <span class="status-badge" [style.--status-color]="'var(' + statusColorVar() + ')'">
      {{ statusLabel() }}
    </span>
  </div>

  <div class="membership-row">
    <span class="membership-badge membership-badge--{{ membershipVariant() }}">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
        <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      {{ membershipLabel() }}
    </span>
    <button type="button" class="renew-link" (click)="renew.emit()">Renovar</button>
  </div>

  <div class="account-field">
    <span class="account-field-label">Correo</span>
    <span class="account-field-value">{{ account().email }}</span>
  </div>

  <div class="account-field">
    <span class="account-field-label">Contraseña</span>
    <div class="password-row">
      <span class="account-field-value password-value">
        {{ showPassword() ? account().password : '••••••••' }}
      </span>
      <button
        type="button"
        class="password-toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.4 5.5A10.6 10.6 0 0 1 12 5c5 0 8.5 3.5 10 7-.6 1.3-1.5 2.6-2.6 3.7M6.2 6.9C4.4 8.2 3 10 2 12c1.5 3.5 5 7 10 7 1.1 0 2.1-.2 3-.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M2 12c1.5-3.5 5-7 10-7s8.5 3.5 10 7c-1.5 3.5-5 7-10 7s-8.5-3.5-10-7Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (account().observations) {
    <div class="account-field">
      <span class="account-field-label">Observaciones</span>
      <span class="account-field-value observations">{{ account().observations }}</span>
    </div>
  }

  <div class="account-card-footer">
    <button type="button" class="btn btn-secondary profiles-button" (click)="viewProfiles.emit()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5" />
        <path d="M5.5 19.5c0-3.3 2.9-5.7 6.5-5.7s6.5 2.4 6.5 5.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      Ver perfiles
      <span class="profiles-count">{{ account().profilesCount }}</span>
    </button>

    <div class="account-card-actions">
      <button type="button" class="icon-button" (click)="edit.emit()" aria-label="Editar cuenta">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 20h4l10.5-10.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button type="button" class="icon-button icon-button--danger" (click)="remove.emit()" aria-label="Eliminar cuenta">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>
</article>
