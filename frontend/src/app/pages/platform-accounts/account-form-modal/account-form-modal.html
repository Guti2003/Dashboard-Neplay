<app-modal [title]="(isEdit() ? 'Editar cuenta de ' : 'Nueva cuenta de ') + platformName()" size="md" (close)="cancel.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="account-form">
    @if (errorMessage()) {
      <div class="form-alert" role="alert">{{ errorMessage() }}</div>
    }

    <label class="field">
      <span class="field-label">Correo</span>
      <input type="email" class="field-input" formControlName="email" placeholder="cuenta@correo.com" autocomplete="off" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">
          @if (form.controls.email.hasError('required')) {
            El correo es obligatorio.
          } @else {
            Ingresa un correo válido.
          }
        </span>
      }
    </label>

    <label class="field">
      <span class="field-label">Contraseña</span>
      <div class="password-input">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          class="field-input"
          formControlName="password"
          placeholder="Contraseña de la cuenta"
          autocomplete="off"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.4 5.5A10.6 10.6 0 0 1 12 5c5 0 8.5 3.5 10 7-.6 1.3-1.5 2.6-2.6 3.7M6.2 6.9C4.4 8.2 3 10 2 12c1.5 3.5 5 7 10 7 1.1 0 2.1-.2 3-.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12c1.5-3.5 5-7 10-7s8.5 3.5 10 7c-1.5 3.5-5 7-10 7s-8.5-3.5-10-7Z" stroke="currentColor" stroke-width="1.5" />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
            </svg>
          }
        </button>
      </div>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">La contraseña es obligatoria.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Estado</span>
      <select class="field-select" formControlName="status">
        <option value="activo">Activo</option>
        <option value="suspendido">Suspendido</option>
        <option value="vencido">Vencido</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">Observaciones</span>
      <textarea class="field-textarea" formControlName="observations" placeholder="Notas internas (opcional)"></textarea>
    </label>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : isEdit() ? 'Guardar cambios' : 'Crear cuenta' }}
      </button>
    </div>
  </form>
</app-modal>
