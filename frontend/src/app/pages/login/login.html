<div class="login-page">
  <div class="login-card glass-panel glass-appear" appGlassShine>
    <div class="accent-bar" aria-hidden="true"></div>

    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <h1>NetPlay</h1>
        <p>Panel administrativo de membresías</p>
        <div class="brand-dots" aria-hidden="true">
          <span class="dot dot--netflix"></span>
          <span class="dot dot--disney"></span>
          <span class="dot dot--amazon"></span>
        </div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage()) {
        <div class="alert" role="alert">{{ errorMessage() }}</div>
      }

      <label class="field">
        <span class="field-label">Correo electrónico</span>
        <div class="field-control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input
            type="email"
            formControlName="email"
            placeholder="admin@netplay.com"
            autocomplete="username"
          />
        </div>
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">
            @if (form.controls.email.hasError('required')) {
              El correo es obligatorio.
            } @else {
              Ingresa un correo válido.
            }
          </span>
        }
      </label>

      <label class="field">
        <span class="field-label">Contraseña</span>
        <div class="field-control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.4 5.5A10.6 10.6 0 0 1 12 5c5 0 8.5 3.5 10 7-.6 1.3-1.5 2.6-2.6 3.7M6.2 6.9C4.4 8.2 3 10 2 12c1.5 3.5 5 7 10 7 1.1 0 2.1-.2 3-.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M2 12c1.5-3.5 5-7 10-7s8.5 3.5 10 7c-1.5 3.5-5 7-10 7s-8.5-3.5-10-7Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
              </svg>
            }
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">La contraseña es obligatoria.</span>
        }
      </label>

      <div class="row-between">
        <label class="checkbox">
          <input type="checkbox" formControlName="rememberMe" />
          <span class="checkbox-box" aria-hidden="true"></span>
          Recordarme
        </label>
      </div>

      <button type="submit" class="submit-button" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          Ingresando...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>
  </div>
</div>
