<div class="client-picker">
  @if (createOpen()) {
    <div class="client-create">
      @if (createError()) {
        <span class="field-error">{{ createError() }}</span>
      }
      <input
        type="text"
        class="field-input"
        placeholder="Nombre del cliente"
        [value]="newName()"
        (input)="newName.set($any($event.target).value)"
      />
      <input
        type="text"
        class="field-input"
        placeholder="Número de celular"
        [value]="newPhone()"
        (input)="newPhone.set($any($event.target).value)"
      />
      <div class="client-create-actions">
        <button type="button" class="btn btn-secondary" (click)="closeCreate()">Cancelar</button>
        <button type="button" class="btn btn-primary" [disabled]="creating()" (click)="submitCreate()">
          {{ creating() ? 'Creando...' : 'Crear y asignar' }}
        </button>
      </div>
    </div>
  } @else if (selected()) {
    <div class="client-chip">
      <div class="client-chip-info">
        <span class="client-chip-name">{{ selected()!.name }}</span>
        <span class="client-chip-phone">{{ selected()!.phone }}</span>
      </div>
      <button type="button" class="client-chip-clear" (click)="clear()" aria-label="Quitar cliente">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  } @else {
    <div class="client-search">
      <input
        type="text"
        class="field-input"
        placeholder="Buscar cliente por nombre o celular..."
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />

      @if (dropdownOpen()) {
        <div class="client-dropdown glass-panel">
          @if (searching()) {
            <div class="client-dropdown-item client-dropdown-item--muted">Buscando...</div>
          } @else {
            @for (client of results(); track client.id) {
              <button type="button" class="client-dropdown-item" (mousedown)="pick(client)">
                <span>{{ client.name }}</span>
                <span class="muted">{{ client.phone }}</span>
              </button>
            } @empty {
              <div class="client-dropdown-item client-dropdown-item--muted">Sin resultados.</div>
            }
          }
          <button type="button" class="client-dropdown-item client-dropdown-item--create" (mousedown)="openCreate()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Crear cliente nuevo
          </button>
        </div>
      }
    </div>
  }
</div>
