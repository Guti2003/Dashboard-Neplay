<div class="toast-container">
  @for (toast of toasts(); track toast.id) {
    <div class="toast toast--{{ toast.type }} glass-panel glass-appear" role="alert">
      <span class="toast-icon">
        @switch (toast.type) {
          @case ('success') {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m5 12 5 5 9-10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 9v4m0 4h.01M10.3 3.9 2.7 17.1a1.7 1.7 0 0 0 1.5 2.6h15.6a1.7 1.7 0 0 0 1.5-2.6L13.7 3.9a1.7 1.7 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
              <path d="M12 11v5m0-8h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          }
        }
      </span>
      <span class="toast-message">{{ toast.message }}</span>
      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Cerrar notificación">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  }
</div>
